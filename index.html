<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Quote</title>
<meta name="description" content="One quote each time you open it: courage, persistence, greatness, discipline and doing the right thing. English, Hindi and Urdu.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Quote">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Tiro+Devanagari+Hindi&family=Inter:wght@400;500&display=swap">
<style>
:root {
  --bg: #000;
  --ink: #fff;
  --dim: rgba(255,255,255,0.55);
  --faint: rgba(255,255,255,0.28);
  --line: rgba(255,255,255,0.16);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body {
  font-family: Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; min-height: 100dvh;
  padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  user-select: none; -webkit-tap-highlight-color: transparent;
}
main {
  flex: 1; display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 48px 0 24px;
}
figure {
  margin: 0; max-width: 820px; width: 100%; text-align: center;
  transition: opacity .45s ease, transform .45s ease;
}
figure.out { opacity: 0; transform: translateY(6px); }
.tag {
  font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 28px;
}
blockquote {
  margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500;
  line-height: 1.32; text-wrap: balance; user-select: text;
  font-size: clamp(26px, 4.6vw, 52px);
}
blockquote.m { font-size: clamp(23px, 3.6vw, 40px); }
blockquote.l { font-size: clamp(20px, 2.9vw, 32px); line-height: 1.4; }
.deva blockquote { font-family: "Tiro Devanagari Hindi", serif; line-height: 1.7; }
.deva blockquote { font-size: clamp(22px, 3.6vw, 40px); }
.deva blockquote.m { font-size: clamp(20px, 3vw, 32px); }
.deva blockquote.l { font-size: clamp(18px, 2.5vw, 27px); }
figcaption {
  margin-top: 28px; font-size: 15px; color: var(--dim); letter-spacing: .02em;
}
.deva figcaption { font-family: "Tiro Devanagari Hindi", serif; font-size: 17px; }
figcaption::before { content: "— "; }
footer {
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between;
  padding: 14px 0 18px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--faint);
  opacity: .55; transition: opacity .3s;
}
footer:hover, footer:focus-within { opacity: 1; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button, select {
  font: inherit; color: var(--dim); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
select { appearance: none; padding-right: 12px; }
select option { background: #000; color: #fff; }
button:hover, select:hover { color: var(--ink); border-color: var(--faint); }
button[aria-pressed="true"] { color: #000; background: var(--ink); border-color: var(--ink); }
.hint { white-space: nowrap; }
.toast {
  position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
  background: #fff; color: #000; padding: 8px 14px; border-radius: 999px; font-size: 13px;
  opacity: 0; transition: opacity .25s; pointer-events: none;
}
.toast.on { opacity: 1; }
.panel {
  position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none;
  align-items: center; justify-content: center; padding: 24px 16px; z-index: 5;
}
.panel.on { display: flex; }
.sheet {
  width: 100%; max-width: 360px; max-height: 80dvh; overflow: auto;
  border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; background: #000;
}
.sheet h2 { margin: 0 0 4px; font-size: 13px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
.sheet .sub { font-size: 12px; color: var(--faint); margin-bottom: 16px; }
.totals { display: flex; gap: 22px; margin-bottom: 16px; }
.totals b { display: block; font-size: 26px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.totals span { font-size: 11px; color: var(--faint); letter-spacing: .08em; text-transform: uppercase; }
.days { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.days td { padding: 7px 0; border-top: 1px solid var(--line); color: var(--dim); }
.days td:last-child { text-align: right; color: var(--ink); }
.sheet .close { margin-top: 16px; width: 100%; }
@media (max-width: 560px) {
  main { padding-top: 32px; }
  .hint { display: none; }
  footer { justify-content: center; }
}
</style>
</head>
<body>
<main id="stage" aria-live="polite" title="Tap for another quote">
  <figure id="card" class="out">
    <div class="tag" id="tag"></div>
    <blockquote id="text"></blockquote>
    <figcaption id="author"></figcaption>
  </figure>
</main>
<footer>
  <div class="group" role="group" aria-label="Language">
    <button data-lang="all">All</button>
    <button data-lang="en">English</button>
    <button data-lang="hi">हिन्दी</button>
    <button data-lang="ur">उर्दू</button>
  </div>
  <div class="group">
    <select id="theme" aria-label="Theme"></select>
    <button id="prev" aria-label="Previous quote">←</button>
    <button id="next" aria-label="Next quote">→</button>
    <button id="copy" aria-label="Copy quote">Copy</button>
    <button id="visits" aria-label="Your visits">Visits</button>
  </div>
  <span class="hint">tap or press → for another</span>
</footer>
<div class="toast" id="toast">Copied</div>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Your visits">
  <div class="sheet">
    <h2>Your visits</h2>
    <div class="sub">Opens of this page in this browser only. Nothing leaves your device.</div>
    <div class="totals" id="totals"></div>
    <table class="days" id="days"></table>
    <button class="close" id="close">Close</button>
  </div>
</div>
<script>
const THEMES = {
  all: "All themes", procrastination: "Procrastination", perseverance: "Not giving up", bravery: "Bravery",
  greatness: "Greatness", right: "Doing the right thing", patience: "Delayed gratification",
  purpose: "Why we do anything", consistency: "Consistency", hardwork: "Hard work"
};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const $ = (id) => document.getElementById(id);
let Q = [], deck = [], pos = 0, history = [], hpos = -1;
let lang = store.get("lang", "all"), theme = store.get("theme", "all");

// Small seeded PRNG so the shuffled order survives reloads.
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Weighted shuffle: hand-picked "best" quotes are 3x as likely to come up early.
function buildDeck(seed) {
  const r = rng(seed);
  return Q.map((q, i) => [Math.log(r() || 1e-9) / (q[4] ? 3 : 1), i])
    .sort((a, b) => b[0] - a[0]).map((x) => x[1]);
}
function matches(i) { const q = Q[i]; return (lang === "all" || q[2] === lang) && (theme === "all" || q[3] === theme); }

function nextIndex() {
  for (let n = 0; n < deck.length; n++) {
    if (pos >= deck.length) { const s = (Math.random() * 2 ** 31) | 0; store.set("seed", s); deck = buildDeck(s); pos = 0; }
    const i = deck[pos++];
    if (matches(i)) { store.set("pos", pos); return i; }
  }
  return null;
}

function show(i) {
  const card = $("card");
  card.classList.add("out");
  setTimeout(() => {
    if (i === null) {
      $("tag").textContent = ""; $("text").textContent = "No quotes match these filters."; $("author").textContent = "";
    } else {
      const [t, a, l, th] = Q[i];
      card.classList.toggle("deva", l !== "en");
      card.lang = l === "en" ? "en" : l;
      $("tag").textContent = THEMES[th] || "";
      const el = $("text");
      el.textContent = t;
      el.className = t.length > 170 ? "l" : t.length > 95 ? "m" : "";
      $("author").textContent = a;
    }
    card.classList.remove("out");
  }, 220);
}
function forward() {
  if (hpos < history.length - 1) { hpos++; show(history[hpos]); return; }
  const i = nextIndex(); if (i === null) return show(null);
  history.push(i); hpos = history.length - 1; show(i);
}
function back() { if (hpos > 0) { hpos--; show(history[hpos]); } }

function syncControls() {
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("theme").value = theme;
}
function refilter() { store.set("lang", lang); store.set("theme", theme); syncControls(); history = []; hpos = -1; forward(); }

async function init() {
  $("theme").innerHTML = Object.entries(THEMES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  syncControls();
  Q = await (await fetch("quotes.json")).json();
  let seed = store.get("seed", null);
  if (seed === null) { seed = (Math.random() * 2 ** 31) | 0; store.set("seed", seed); }
  deck = buildDeck(seed); pos = store.get("pos", 0);
  forward();
}

$("stage").addEventListener("click", (e) => { if (!window.getSelection().toString()) forward(); });
$("next").onclick = forward;
$("prev").onclick = back;
$("theme").onchange = (e) => { theme = e.target.value; refilter(); };
document.querySelectorAll("[data-lang]").forEach((b) => b.onclick = () => { lang = b.dataset.lang; refilter(); });
$("copy").onclick = async () => {
  const t = `${$("text").textContent}\n— ${$("author").textContent}`;
  try { await navigator.clipboard.writeText(t); const el = $("toast"); el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1200); } catch {}
};
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  if ($("panel").classList.contains("on")) { if (e.key === "Escape") hideVisits(); return; }
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") { e.preventDefault(); forward(); }
  if (e.key === "ArrowLeft") back();
});
let tx = null;
document.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (tx === null || $("panel").classList.contains("on")) { tx = null; return; } const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (dx > 60) back(); else if (dx < -60) forward();
});

// Visit log, kept only in this browser: { "YYYY-MM-DD": opens }.
function today() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function logVisit() { const v = store.get("visits", {}); const k = today(); v[k] = (v[k] || 0) + 1; store.set("visits", v); }
function showVisits() {
  const v = store.get("visits", {}), days = Object.keys(v).sort().reverse();
  const total = days.reduce((s, k) => s + v[k], 0);
  $("totals").innerHTML = `<div><b>${v[today()] || 0}</b><span>Today</span></div><div><b>${total}</b><span>All time</span></div><div><b>${days.length}</b><span>Days</span></div>`;
  const fmt = (k) => new Date(k + "T00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  $("days").innerHTML = days.map((k) => `<tr><td>${fmt(k)}</td><td>${v[k]}</td></tr>`).join("");
  $("panel").classList.add("on");
}
const hideVisits = () => $("panel").classList.remove("on");
$("visits").onclick = showVisits;
$("close").onclick = hideVisits;
$("panel").onclick = (e) => { if (e.target.id === "panel") hideVisits(); };

logVisit();
init();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
